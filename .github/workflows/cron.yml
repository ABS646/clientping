name: DueNudge Reminder Cron

on:
  schedule:
    # Runs at minute 0 of every hour
    - cron: '0 * * * *'
  workflow_dispatch: # This lets you run it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the reminder API
        env:
          DUENUDGE_CRON_SECRET: ${{ secrets.DUENUDGE_CRON_SECRET }}
        run: |
          test -n "$DUENUDGE_CRON_SECRET"
          curl --fail --silent --show-error -L -H "Authorization: Bearer $DUENUDGE_CRON_SECRET" "https://getduenudge.com/api/send-reminders"
