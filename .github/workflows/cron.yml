name: DueNudge Reminder Cron

on:
  schedule:
    # Runs at minute 0 of every hour
    - cron: '0 * * * *'
  workflow_dispatch: # This lets you run it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the reminder API
        run: |
          curl -L -X GET "https://getduenudge.com/api/send-reminders"
